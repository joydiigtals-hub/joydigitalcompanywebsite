  </defs>
  <rect width="900" height="400" rx="28" fill="url(#bg)"/>
  <!-- Icon: angular J + global network nodes -->
  <g transform="translate(90,92) scale(1.25)">
    <!-- network lines -->
    <g stroke="#C4A1FF" stroke-width="2.5" stroke-opacity="0.7" fill="none">
      <line x1="168" y1="45" x2="212" y2="14"/>
      <line x1="168" y1="45" x2="240" y2="62"/>
      <line x1="168" y1="45" x2="222" y2="112"/>
      <line x1="212" y1="14" x2="240" y2="62" stroke-opacity="0.35"/>
      <line x1="240" y1="62" x2="222" y2="112" stroke-opacity="0.35"/>
    </g>
    <!-- J -->
    <polygon points="60,30 168,30 168,60 138,60 138,140 104,176 36,176 36,144 92,144 108,128 108,60 60,60" fill="url(#pu)"/>
    <polygon points="60,30 168,30 138,60 60,60" fill="#FFFFFF" fill-opacity="0.22"/>
    <polygon points="108,128 138,140 104,176 92,144" fill="#000000" fill-opacity="0.25"/>
    <!-- nodes -->
    <circle cx="212" cy="14" r="7" fill="#F5D0FE"/>
    <circle cx="240" cy="62" r="9" fill="#FFFFFF"/>
    <circle cx="219" cy="109" r="9" fill="none" stroke="#FFFFFF" stroke-width="3.5"/><line x1="226" y1="116" x2="236" y2="126" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="410" y="215" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">Joy<tspan font-weight="300" fill="#C4A1FF">Digital</tspan></text>
  <text x="414" y="260" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3.5" fill="#A78BFA">TAKING YOUR BUSINESS GLOBAL</text>
</svg>
